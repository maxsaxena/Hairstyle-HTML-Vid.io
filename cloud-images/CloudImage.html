<!-- ================= VIDEO PLAY BUTTON SCRIPT ================= -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  var video = document.getElementById("mainVideo");
  var playButton = document.getElementById("playButton");

  if (!video || !playButton) return;

  function togglePlay() {
    if (video.paused || video.ended) {
      video.play();
      video.controls = true;
      playButton.parentElement.classList.add("playing");
    } else {
      video.pause();
      playButton.parentElement.classList.remove("playing");
    }
  }

  playButton.addEventListener("click", togglePlay);
  video.addEventListener("click", togglePlay);

  video.addEventListener("pause", function() {
    playButton.parentElement.classList.remove("playing");
  });

  video.addEventListener("play", function() {
    playButton.parentElement.classList.add("playing");
  });
});
</script>

  var STORAGE_KEY = "popup_ad_last_time";
  var SHOW_INTERVAL = 120000; // 2 minutes

  // --- storage helpers ---
  function getLastTime() {
    try {
      return parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    } catch(e) {
      var match = document.cookie.match(new RegExp(STORAGE_KEY + "=([^;]+)"));
      return match ? parseInt(match[1]) : 0;
    }
  }

  function setLastTime() {
    var now = Date.now();
    try {
      localStorage.setItem(STORAGE_KEY, now);
    } catch(e) {}

    var d = new Date();
    d.setTime(d.getTime() + (7 * 24 * 60 * 60 * 1000));
    document.cookie = STORAGE_KEY + "=" + now + "; path=/; expires=" + d.toUTCString();
  }

  var overlay = document.getElementById("adOverlay");
  if (!overlay) return;

  var lastTime = getLastTime();
  var now = Date.now();

  // ⛔ Skip if opened within 2 minutes
  if (now - lastTime < SHOW_INTERVAL) return;

  var originalOverflow;

  function openAd() {
    setLastTime();

    overlay.style.display = "flex";
    overlay.classList.add("fade-in");
    overlay.setAttribute("aria-hidden", "false");

    originalOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
  }

  function closeAd() {
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = originalOverflow || ";
  }

  // Close actions
  overlay.querySelector(".ad-close").addEventListener("click", closeAd);
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) closeAd();
  });

  // --- delay + video-aware logic ---
  var delay = Math.floor(Math.random() * (MAX_DELAY_MS - MIN_DELAY_MS + 1)) + MIN_DELAY_MS;

  function showWhenVideosDone() {
    var videos = document.querySelectorAll("video[autoplay]");

    if (!videos.length) return openAd();

    var playing = Array.from(videos).filter(v => !v.paused && !v.ended);

    if (!playing.length) return openAd();

    var remaining = playing.length;

    playing.forEach(function(v){
      function done() {
        v.removeEventListener("ended", done);
        v.removeEventListener("pause", done);
        remaining--;
        if (remaining <= 0) openAd();
      }
      v.addEventListener("ended", done);
      v.addEventListener("pause", done);
    });

    // fallback max wait
    setTimeout(openAd, 120000);
  }

  if (document.readyState === "complete" || document.readyState === "interactive") {
    setTimeout(showWhenVideosDone, delay);
  } else {
    window.addEventListener("DOMContentLoaded", function(){
      setTimeout(showWhenVideosDone, delay);
    });
  }

})();
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {

  const images = document.querySelectorAll("img[data-src]");

  const lazyLoad = (img) => {
    img.src = img.dataset.src;
    img.onload = () => {
      img.classList.add("loaded");
    };
  };

  if ("IntersectionObserver" in window) {
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          lazyLoad(entry.target);
          obs.unobserve(entry.target);
        }
      });
    });

    images.forEach(img => observer.observe(img));

  } else {
    // Fallback (older WebView)
    images.forEach(img => lazyLoad(img));
  }

});
</script>
